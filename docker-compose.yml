# =============================================================================
# CyberShield XDR Platform — Docker Compose
# Services: nginx, frontend, backend, celery-worker, celery-beat,
#           postgres, redis, opensearch
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Nginx — Reverse Proxy / Gateway
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: cybershield-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - cybershield-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Frontend — React/Vite/TypeScript
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: cybershield-frontend
    restart: unless-stopped
    networks:
      - cybershield-net
    depends_on:
      - backend

  # ---------------------------------------------------------------------------
  # Backend — FastAPI
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: cybershield-backend
    env_file: .env
    volumes:
      - uploads:/app/uploads
      - reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cybershield-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ---------------------------------------------------------------------------
  # Celery Worker — Background Tasks
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: cybershield-celery-worker
    command: celery -A backend.workers.celery_app worker --loglevel=info --queues=scans,malware,reports,notifications,threat_intel --concurrency=4
    env_file: .env
    volumes:
      - uploads:/app/uploads
      - reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cybershield-net

  # ---------------------------------------------------------------------------
  # Celery Beat — Scheduled Tasks
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: cybershield-celery-beat
    command: celery -A backend.workers.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - cybershield-net

  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cybershield-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cybershield}
      POSTGRES_USER: ${POSTGRES_USER:-cybershield_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - cybershield-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybershield_user} -d ${POSTGRES_DB:-cybershield}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"  # Remove in production

  # ---------------------------------------------------------------------------
  # Redis — Cache, Session Store, Celery Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: cybershield-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - cybershield-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"  # Remove in production

  # ---------------------------------------------------------------------------
  # OpenSearch — Log Aggregation & Search
  # ---------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: cybershield-opensearch
    environment:
      - cluster.name=cybershield-cluster
      - node.name=cybershield-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped
    networks:
      - cybershield-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - "9200:9200"  # Remove in production

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  opensearch_data:
    driver: local
  uploads:
    driver: local
  reports:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  cybershield-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

version: '3.8'

services:
  test_postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_cybershield
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_cybershield"]
      interval: 2s
      timeout: 5s
      retries: 5

  test_redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --requirepass test_redis_pass --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "test_redis_pass", "ping"]
      interval: 2s
      timeout: 5s
      retries: 5
